name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/topic-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=topic-api
          cache-to: type=gha,mode=max,scope=topic-api

  build-web:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/topic-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=topic-web
          cache-to: type=gha,mode=max,scope=topic-web

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/compose.prod.yaml
          target: /opt/topic
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_API_IMAGE: ${{ needs.build-api.outputs.image }}:${{ github.sha }}
          DEPLOY_WEB_IMAGE: ${{ needs.build-web.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_API_IMAGE,DEPLOY_WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/topic
            test -f .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            grep -vE '^(API_IMAGE|WEB_IMAGE)=' .env > .env.tmp || true
            printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$DEPLOY_API_IMAGE" "$DEPLOY_WEB_IMAGE" >> .env.tmp
            mv .env.tmp .env
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            docker compose -f compose.prod.yaml pull api web
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
            host="${PUBLIC_HOST:?PUBLIC_HOST missing in .env}"
            https_port="${HTTPS_PORT:-443}"
            for i in $(seq 1 40); do
              if curl -fsS --resolve "${host}:${https_port}:127.0.0.1" \
                "https://${host}:${https_port}/api/health" >/dev/null; then
                echo "health ok"
                exit 0
              fi
              sleep 3
            done
            echo "health check failed" >&2
            docker compose -f compose.prod.yaml logs --tail=100 web api
            exit 1
